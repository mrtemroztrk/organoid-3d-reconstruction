<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JX-3D · Control panel</title>
<style>
:root{
  --bg:#0a0d14; --panel:#111725; --panel2:#161e30; --line:#222d45;
  --fg:#e8edf7; --muted:#8b9bb8; --accent:#4dd0e1; --accent2:#ffb74d;
  --good:#66bb6a; --bad:#ef5350;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);
  font:13.5px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden;
}
header{
  display:flex;align-items:center;gap:14px;padding:12px 18px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
header h1{font-size:16px;font-weight:650}
header h1 span{color:var(--accent)}
.spacer{flex:1}
.tag{font-size:11.5px;color:var(--muted)}
main{display:grid;grid-template-columns:380px 1fr;min-height:0}
.col{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.col.left{border-right:1px solid var(--line);background:var(--panel)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:13px}
.card h2{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);font-weight:650;margin-bottom:10px;
}
.path{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  color:var(--muted);word-break:break-all;margin-bottom:8px;
}
.list{display:flex;flex-direction:column;gap:5px;max-height:330px;overflow-y:auto}
.row{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;
  background:rgba(0,0,0,.22);cursor:pointer;border:1px solid transparent;
}
.row:hover{background:rgba(77,208,225,.10)}
.row.sel{border-color:var(--accent);background:rgba(77,208,225,.16)}
.row .ico{width:16px;text-align:center;opacity:.75;flex:none}
.row .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:11px;color:var(--muted);white-space:nowrap}
.pill{
  font-size:10px;padding:1px 6px;border-radius:9px;background:#20304d;color:#a9c2e5;
}
.pill.ok{background:#1d3a24;color:#8fd79a}
.pill.warn{background:#3d3320;color:#e6c07b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px}
input,select{
  width:100%;background:#0d1220;color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;font-size:12.5px;font-family:inherit;
}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.btn{
  background:var(--accent);color:#06222a;border:none;border-radius:7px;
  padding:10px 14px;font-size:13.5px;font-weight:650;cursor:pointer;width:100%;
  font-family:inherit;
}
.btn:disabled{background:#25344c;color:#6c7f9c;cursor:not-allowed}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--accent)}
#log{
  flex:1;min-height:0;background:#070a11;border:1px solid var(--line);border-radius:9px;
  padding:12px 14px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5;
  color:#c8d6ea;
}
#log .hl{color:var(--accent)}
#log .warn{color:var(--accent2)}
#log .bad{color:var(--bad)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rescard{
  background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden;
  display:flex;flex-direction:column;
}
.rescard img{width:100%;height:120px;object-fit:cover;display:block;background:#000}
.rescard .body{padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.rescard .t{font-weight:650}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#3a4a66;flex:none}
.dot.on{background:var(--good);box-shadow:0 0 8px var(--good);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a3550;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<header>
  <h1>JX-3D <span>·</span> Control panel</h1>
  <div class="spacer"></div>
  <div class="status"><span class="dot" id="dot"></span><span id="statustext">idle</span></div>
</header>

<main>
  <!-- ------------------------------------------------ left: pick and configure -->
  <section class="col left">
    <div class="card">
      <h2>Z-stack folder</h2>
      <div class="path" id="cwd">…</div>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <button class="btn ghost" id="up" style="width:auto;padding:6px 11px">↑ up</button>
        <input id="jump" placeholder="type a path and press Enter">
      </div>
      <div class="list" id="browser"></div>
    </div>

    <div class="card">
      <h2>Settings</h2>
      <div class="grid">
        <div>
          <label>Detection mode</label>
          <select id="mode">
            <option value="both">both (best coverage)</option>
            <option value="edf">projection only (fast)</option>
            <option value="slices">per-slice only</option>
          </select>
        </div>
        <div>
          <label>Segmenter</label>
          <select id="detector">
            <option value="cellpose">Cellpose-SAM (GPU)</option>
            <option value="classical">classical (CPU)</option>
          </select>
        </div>
        <div>
          <label>Expected diameter (px)</label>
          <input id="diameter" type="number" value="40" min="4" step="1">
        </div>
        <div>
          <label>Min focus sharpness</label>
          <input id="min_sharpness" type="number" value="0.25" min="0" max="0.9" step="0.05">
        </div>
        <div>
          <label>Min diameter (px)</label>
          <input id="min_diameter" type="number" value="8" min="2" step="1">
        </div>
        <div>
          <label>Max diameter (px)</label>
          <input id="max_diameter" type="number" value="160" min="10" step="1">
        </div>
      </div>
      <div style="margin-top:9px;display:flex;gap:14px;font-size:12px;color:var(--muted)">
        <label style="display:flex;gap:6px;align-items:center;margin:0">
          <input type="checkbox" id="fit_dome" checked style="width:auto"> fit dome</label>
        <label style="display:flex;gap:6px;align-items:center;margin:0">
          <input type="checkbox" id="no_cache" style="width:auto"> ignore cache</label>
        <label style="display:flex;gap:6px;align-items:center;margin:0">
          <input type="checkbox" id="no_gpu" style="width:auto"> no GPU</label>
      </div>
      <div class="grid" style="margin-top:9px">
        <div>
          <label>µm / pixel (optional)</label>
          <input id="px_size" type="number" step="0.0001" placeholder="from .gci">
        </div>
        <div>
          <label>µm / slice (optional)</label>
          <input id="z_step_um" type="number" step="0.1" placeholder="from .gci">
        </div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:7px;line-height:1.45">
        Sizes are in pixels. Micrometre columns are only written when a scale is
        actually known — from the .gci or from these two fields.
      </div>
    </div>

    <button class="btn" id="runbtn" disabled>Select a stack</button>
  </section>

  <!-- ------------------------------------------------------- right: log + results -->
  <section class="col">
    <div id="log">Pick a Z-stack folder on the left, then press Run.</div>
    <div class="card">
      <h2>Results</h2>
      <div class="results" id="results"></div>
    </div>
  </section>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
let selected = null, lastSeq = -1, cwd = null;

/* ------------------------------------------------------------ folder browser */
async function loadScan(root){
  const r = await fetch("/api/scan?root=" + encodeURIComponent(root));
  const d = await r.json();
  cwd = d.root;
  $("cwd").textContent = d.root;
  $("up").disabled = !d.parent;
  $("up").onclick = () => loadScan(d.parent);

  const el = $("browser");
  el.innerHTML = "";
  if (d.error){ el.innerHTML = `<div class="row" style="color:var(--bad)">${d.error}</div>`; return; }

  for (const s of d.stacks){
    const div = document.createElement("div");
    div.className = "row" + (selected && selected.path === s.path ? " sel" : "");
    div.innerHTML = `<span class="ico">🧫</span><span class="nm">${s.name}</span>
      <span class="meta">${s.slices} slices</span>
      ${s.calibrated ? '<span class="pill ok">.gci</span>' : '<span class="pill warn">no scale</span>'}
      ${s.done ? `<span class="pill ok">${s.organoids ?? "done"}</span>` : ""}`;
    div.onclick = () => { selected = s; loadScan(cwd); updateRun(); };
    el.appendChild(div);
  }
  for (const dir of d.dirs){
    const div = document.createElement("div");
    div.className = "row";
    div.innerHTML = `<span class="ico">📁</span><span class="nm">${dir.name}</span>`;
    div.onclick = () => loadScan(dir.path);
    el.appendChild(div);
  }
  if (!d.stacks.length && !d.dirs.length){
    el.innerHTML = '<div class="row" style="color:var(--muted)">nothing here</div>';
  }
}
$("jump").onkeydown = e => { if (e.key === "Enter") loadScan(e.target.value.trim()); };

function updateRun(){
  const b = $("runbtn");
  b.disabled = !selected;
  b.textContent = selected ? `Run  ·  ${selected.name}` : "Select a stack";
}

/* ---------------------------------------------------------------------- run */
$("runbtn").onclick = async () => {
  if (!selected) return;
  const body = {
    folder: selected.path,
    mode: $("mode").value,
    detector: $("detector").value,
    diameter: +$("diameter").value,
    min_diameter: +$("min_diameter").value,
    max_diameter: +$("max_diameter").value,
    min_sharpness: +$("min_sharpness").value,
    fit_dome: $("fit_dome").checked,
    no_cache: $("no_cache").checked,
    no_gpu: $("no_gpu").checked,
    px_size: $("px_size").value ? +$("px_size").value : null,
    z_step_um: $("z_step_um").value ? +$("z_step_um").value : null,
  };
  $("runbtn").disabled = true;
  const r = await fetch("/api/run", {method:"POST", body: JSON.stringify(body)});
  const d = await r.json();
  if (d.error){ $("log").textContent = d.error; $("runbtn").disabled = false; }
  lastSeq = -1;
};

/* ------------------------------------------------------------------ polling */
function colourise(line){
  const esc = line.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  if (/^!!|FAILED|Traceback|Error/.test(esc)) return `<span class="bad">${esc}</span>`;
  if (/^\s*!!|NOT CALIBRATED|rejected/.test(esc)) return `<span class="warn">${esc}</span>`;
  if (/^\[|^={5,}|→/.test(esc)) return `<span class="hl">${esc}</span>`;
  return esc;
}

async function poll(){
  try{
    const r = await fetch("/api/status?since=" + lastSeq);
    const d = await r.json();
    if (d.lines){
      const log = $("log");
      const stuck = log.scrollTop + log.clientHeight >= log.scrollHeight - 40;
      log.innerHTML = d.lines.map(colourise).join("\n");
      if (stuck) log.scrollTop = log.scrollHeight;
      lastSeq = d.seq;
    }
    $("dot").className = "dot" + (d.running ? " on" : "");
    $("statustext").textContent = d.running ? "running · " + (d.folder || "") : "idle";
    if (!d.running){
      updateRun();
      if (d.result_dir && d.result_dir !== poll.lastResult){
        poll.lastResult = d.result_dir;
        loadResults();
        loadScan(cwd);
      }
    }
  } catch(e){ /* server restarting; try again next tick */ }
  setTimeout(poll, 600);
}

/* -------------------------------------------------------------------- results */
async function loadResults(){
  const r = await fetch("/api/results");
  const list = await r.json();
  const el = $("results");
  el.innerHTML = "";
  if (!list.length){ el.innerHTML = '<div style="color:var(--muted);font-size:12px">no runs yet</div>'; return; }
  for (const res of list){
    const c = document.createElement("div");
    c.className = "rescard";
    c.innerHTML = `
      <img src="/out/${res.name}/qc_edf.png" onerror="this.style.display='none'">
      <div class="body">
        <div class="t">${res.name}</div>
        <div style="font-size:11.5px;color:var(--muted)">
          ${res.organoids ?? "?"} organoids
          ${res.calibrated ? '· <span class="pill ok">calibrated</span>' : '· <span class="pill warn">px only</span>'}
          ${res.dome ? '· <span class="pill ok">dome</span>' : ""}
        </div>
        <div style="display:flex;gap:6px">
          ${res.viewer ? `<button class="btn ghost" style="padding:6px 9px;font-size:12px"
              onclick="window.open('/out/${res.name}/viewer.html','_blank')">Viewer</button>` : ""}
          <button class="btn ghost" style="padding:6px 9px;font-size:12px"
              onclick="window.open('/out/${res.name}/organoids.csv','_blank')">CSV</button>
        </div>
      </div>`;
    el.appendChild(c);
  }
}

/* --------------------------------------------------------------------- init */
const params = new URLSearchParams(location.search);
loadScan(params.get("root") || ".");
loadResults();
poll();
</script>
</body>
</html>
